name: Migrate SBOMs to OCI Buckets

on:
  workflow_dispatch:

concurrency:
  group: migrate-sboms
  cancel-in-progress: false

# OCI S3 push uses OCI_S3_ACCESS_KEY + OCI_S3_SECRET_KEY; default
# GITHUB_TOKEN only needs read for the checkout.
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install AWS CLI
        run: |
          if ! command -v aws &>/dev/null; then
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Upload missing SBOMs to OCI buckets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_SESSION_TOKEN: ""
          S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
          S3_REGION: ${{ vars.OCI_S3_REGION }}
          PROJECT_BUCKET: ${{ vars.OCI_PROJECT_BUCKET }}
          SUBPROJECT_BUCKET: ${{ vars.OCI_SUBPROJECT_BUCKET }}
          AUTH_MODE: s3
        run: |
          chmod +x util/ingest-sbom-oci.sh
          bash util/ingest-sbom-oci.sh


