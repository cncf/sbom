name: Generate Tooling SBOM

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  WAYBILL_VERSION: v0.2.0

permissions:
  contents: read

jobs:
  generate-tooling-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Waybill
        run: |
          curl -sL "https://github.com/kusari-oss/waybill/releases/download/${WAYBILL_VERSION}/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/waybill.tar.gz
          tar xzf /tmp/waybill.tar.gz -C /tmp
          sudo install -m 755 /tmp/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu/waybill /usr/local/bin/waybill
          waybill --version

      - name: Generate tooling SBOMs
        run: |
          chmod +x util/generate-tooling-sbom.sh
          util/generate-tooling-sbom.sh --output-dir .tooling-sbom

      - name: Write summary
        run: |
          {
            echo "### Tooling SBOM"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`tooling-repo.spdx.json\` | Waybill SBOM for this repository's tooling source at the current commit |"
            echo "| \`tooling-ci.spdx.json\` | SPDX inventory of the GitHub Actions and downloaded tools that generate SBOMs in CI |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tooling SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tooling-sbom-${{ github.sha }}
          path: .tooling-sbom/**
          if-no-files-found: error
          retention-days: 14
