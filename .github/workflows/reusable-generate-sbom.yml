name: Generate SBOM (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      job_name:
        required: true
        type: string
      sbom_path_prefix:
        required: false
        type: string
        default: ''
      force_regenerate:
        required: false
        type: string
        default: 'false'
      releases_mode:
        required: false
        type: string
        default: 'recent'
      max_releases:
        required: false
        type: string
        default: '3'

env:
  WAYBILL_VERSION: v0.1.0-alpha.69

jobs:
  generate:
    runs-on: cncf-c-ubuntu-2-8-x86
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install waybill
        run: |
          curl -sL "https://github.com/kusari-oss/waybill/releases/download/${WAYBILL_VERSION}/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/waybill.tar.gz
          tar xzf /tmp/waybill.tar.gz -C /tmp
          sudo install -m 755 /tmp/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu/waybill /usr/local/bin/waybill
          waybill --version

      - name: Install AWS CLI
        run: |
          if ! command -v aws &>/dev/null; then
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi

      - name: Get stable releases and generate SBOMs
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          RELEASES_MODE: ${{ inputs.releases_mode }}
          MAX_RELEASES: ${{ inputs.max_releases }}
          SBOM_PATH_PREFIX: ${{ inputs.sbom_path_prefix }}
        run: |
          set -e
          
          OWNER="${{ matrix.owner }}"
          REPO="${{ matrix.repo }}"
          PROJECT_NAME="${{ matrix.name }}"
          SANITIZED_PROJECT=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')

          if [ -n "$SBOM_PATH_PREFIX" ]; then
            SBOM_BASE_DIR="sbom/${SBOM_PATH_PREFIX}/${OWNER}/${REPO}"
          else
            SBOM_BASE_DIR="sbom/${SANITIZED_PROJECT}/${REPO}"
          fi
          
          PROCESSED=0
          ONE_WEEK_AGO=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)
          
          echo "::group::Processing $OWNER/$REPO"
          echo "Releases mode: $RELEASES_MODE"
          
          generate_sbom() {
            local TAG="$1"
            local VERSION=$(echo "$TAG" | sed 's/^v//')
            local VERSION_SLUG=$(echo "$VERSION" | tr '.' '_')
            local SBOM_DIR="${SBOM_BASE_DIR}/${VERSION}"
            local SBOM_FILE="${SBOM_DIR}/${REPO}_${VERSION_SLUG}_spdx.json"

            if [ -f "$SBOM_FILE" ] && [ "$FORCE_REGENERATE" != "true" ]; then
              echo "SBOM already exists, skipping..."
              return 1
            fi
            
            echo "Generating SBOM for $OWNER/$REPO@$TAG..."
            
            local TEMP_DIR=$(mktemp -d)
            if ! git clone --depth 1 --branch "$TAG" "https://github.com/${OWNER}/${REPO}.git" "$TEMP_DIR" 2>/dev/null; then
              rm -rf "$TEMP_DIR"
              return 1
            fi
            
            mkdir -p "$SBOM_DIR"
            
            # Generate SBOM with waybill (SPDX 2.3 + deps.dev enrichment)
            if waybill sbom scan \
              --path "$TEMP_DIR" \
              --format spdx-2.3-json \
              --scan-target-name "${OWNER}/${REPO}" \
              --root-name "${OWNER}/${REPO}" \
              --root-version "$TAG" \
              --repo "https://github.com/${OWNER}/${REPO}.git" \
              --git-ref "$TAG" \
              --output "$SBOM_FILE" 2>&1 | tail -5; then
              echo "Successfully generated SBOM: $SBOM_FILE"
              rm -rf "$TEMP_DIR"
              return 0
            else
              echo "Failed to generate SBOM for $OWNER/$REPO@$TAG"
              rm -rf "$TEMP_DIR"
              return 1
            fi
          }
          
          RELEASES=$(gh api repos/${OWNER}/${REPO}/releases --paginate -q '.[0:50]' 2>/dev/null || echo "[]")
          
          if [ "$RELEASES" == "[]" ] || [ -z "$RELEASES" ]; then
            TAGS=$(gh api repos/${OWNER}/${REPO}/tags --paginate -q '.[0:20] | .[].name' 2>/dev/null || echo "")
            
            if [ -z "$TAGS" ]; then
              echo "No tags found, skipping..."
              echo "::endgroup::"
              exit 0
            fi
            
            EFFECTIVE_MAX=$( [ "$RELEASES_MODE" == "recent" ] && echo 3 || echo $MAX_RELEASES )
            
            for TAG in $TAGS; do
              if echo "$TAG" | grep -qiE '[-\.](alpha|beta|rc|pre|dev|snapshot|nightly|canary|test|draft|wip)[0-9]*'; then
                continue
              fi
              if ! echo "$TAG" | grep -qE '^v?[0-9]+\.[0-9]+'; then
                continue
              fi
              if generate_sbom "$TAG"; then
                PROCESSED=$((PROCESSED + 1))
              fi
              if [ "$PROCESSED" -ge "$EFFECTIVE_MAX" ]; then
                break
              fi
            done
          else
            if [ "$RELEASES_MODE" == "recent" ]; then
              readarray -t RELEASE_DATA < <(echo "$RELEASES" | jq -r --arg since "$ONE_WEEK_AGO" '.[] | select(.draft == false and .prerelease == false and .published_at >= $since) | "\(.tag_name)"')
            else
              readarray -t RELEASE_DATA < <(echo "$RELEASES" | jq -r '.[] | select(.draft == false and .prerelease == false) | "\(.tag_name)"')
            fi
            
            for TAG in "${RELEASE_DATA[@]}"; do
              if echo "$TAG" | grep -qiE '[-\.](alpha|beta|rc|pre|dev|snapshot|nightly|canary|test|draft|wip)[0-9]*'; then
                continue
              fi
              if generate_sbom "$TAG"; then
                PROCESSED=$((PROCESSED + 1))
              fi
              if [ "$RELEASES_MODE" == "latest" ] && [ "$PROCESSED" -ge "$MAX_RELEASES" ]; then
                break
              fi
            done
          fi
          
          echo "::endgroup::"

      - name: Upload SBOMs to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
          S3_REGION: ${{ vars.OCI_S3_REGION }}
          PROJECT_BUCKET: ${{ vars.OCI_PROJECT_BUCKET }}
          SUBPROJECT_BUCKET: ${{ vars.OCI_SUBPROJECT_BUCKET }}
          SBOM_PATH_PREFIX: ${{ inputs.sbom_path_prefix }}
        run: |
          OWNER="${{ matrix.owner }}"
          REPO="${{ matrix.repo }}"
          PROJECT_NAME="${{ matrix.name }}"
          SANITIZED_PROJECT=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')

          if [ -n "$SBOM_PATH_PREFIX" ]; then
            SBOM_BASE_DIR="sbom/${SBOM_PATH_PREFIX}/${OWNER}/${REPO}"
          else
            SBOM_BASE_DIR="sbom/${SANITIZED_PROJECT}/${REPO}"
          fi

          if [ ! -d "$SBOM_BASE_DIR" ]; then
            echo "No SBOMs generated, nothing to upload"
            exit 0
          fi

          # Determine bucket and key pattern
          if [ -n "$SBOM_PATH_PREFIX" ]; then
            # Subproject: extract parent project from discovered_by field
            DISCOVERED_BY="${{ matrix.discovered_by }}"
            PARENT_REPO=$(echo "$DISCOVERED_BY" | grep -oP 'from [^/]+/\K[^ ]+' || echo "")
            if [ -z "$PARENT_REPO" ]; then
              PARENT_SLUG=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
            else
              PARENT_SLUG=$(echo "$PARENT_REPO" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
            fi
            REPO_SLUG=$(echo "$REPO" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-')
            BUCKET="$SUBPROJECT_BUCKET"
          else
            BUCKET="$PROJECT_BUCKET"
          fi

          UPLOADED=0
          while IFS= read -r file; do
            rel="${file#${SBOM_BASE_DIR}/}"
            VERSION=$(dirname "$rel")
            VERSION_SLUG=$(echo "$VERSION" | tr '.' '_')

            if [ -n "$SBOM_PATH_PREFIX" ]; then
              S3_KEY="${PARENT_SLUG}/${REPO_SLUG}/${VERSION}/${PARENT_SLUG}_${REPO_SLUG}_${VERSION_SLUG}_spdx.json"
            else
              S3_KEY="${SANITIZED_PROJECT}/${VERSION}/${SANITIZED_PROJECT}_${VERSION_SLUG}_spdx.json"
            fi

            echo "Uploading: s3://${BUCKET}/${S3_KEY}"
            if aws s3api put-object \
              --endpoint-url "$S3_ENDPOINT" \
              --region "$S3_REGION" \
              --bucket "$BUCKET" \
              --key "$S3_KEY" \
              --body "$file" >/dev/null; then
              UPLOADED=$((UPLOADED + 1))
            else
              echo "::warning::Upload failed for ${file}"
            fi
          done < <(find "$SBOM_BASE_DIR" -type f -name '*.json' | sort)

          echo "Uploaded ${UPLOADED} SBOMs to s3://${BUCKET}/"

