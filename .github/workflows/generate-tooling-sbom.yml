name: Generate Tooling SBOM

on:
  push:
    paths-ignore:
      - tooling-sbom/**
  pull_request:
    paths-ignore:
      - tooling-sbom/**
  workflow_dispatch:

env:
  WAYBILL_VERSION: v0.3.0

permissions:
  contents: write

jobs:
  generate-tooling-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Waybill
        run: |
          curl -sL "https://github.com/kusari-oss/waybill/releases/download/${WAYBILL_VERSION}/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/waybill.tar.gz
          tar xzf /tmp/waybill.tar.gz -C /tmp
          sudo install -m 755 /tmp/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu/waybill /usr/local/bin/waybill
          waybill --version

      - name: Generate tooling SBOMs
        run: |
          chmod +x util/generate-tooling-sbom.sh
          util/generate-tooling-sbom.sh --output-dir tooling-sbom-out

      - name: Publish tooling SBOM into repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p tooling-sbom
          cp tooling-sbom-out/*.json tooling-sbom/

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tooling-sbom/*.json

          if git diff --cached --quiet; then
            echo "No tooling SBOM changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh tooling SBOM snapshots [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Write summary
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        if: always()
        run: |
          {
            echo "### Tooling SBOM"
            echo ""
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`tooling-repo.spdx.json\` | Waybill SBOM for this repository's tooling source at the current commit |"
            echo "| \`tooling-ci.spdx.json\` | SPDX inventory of the GitHub Actions and downloaded tools that generate SBOMs in CI |"
            echo ""
            if [ -d tooling-sbom ]; then
              echo "Direct links on \`${REF_NAME}\`:"
              echo "- [tooling-repo.spdx.json](https://github.com/${REPOSITORY}/blob/${REF_NAME}/tooling-sbom/tooling-repo.spdx.json)"
              echo "- [tooling-ci.spdx.json](https://github.com/${REPOSITORY}/blob/${REF_NAME}/tooling-sbom/tooling-ci.spdx.json)"
            else
              echo "Direct repo links are published on \`main\`; for PRs and manual runs use the workflow artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tooling SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tooling-sbom-${{ github.sha }}
          path: tooling-sbom-out/**
          if-no-files-found: error
          retention-days: 14
