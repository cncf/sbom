name: Generate SBOM (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      job_name:
        required: true
        type: string
      sbom_path_prefix:
        required: false
        type: string
        default: ''
      force_regenerate:
        required: false
        type: string
        default: 'false'
      releases_mode:
        required: false
        type: string
        default: 'recent'
      max_releases:
        required: false
        type: string
        default: '3'

jobs:
  generate:
    runs-on: oracle-vm-2cpu-8gb-x86-64
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Validate S3 configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
        run: |
          set -e
          for VAR in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_ENDPOINT; do
            if [ -z "${!VAR}" ]; then
              echo "Missing required S3 config: $VAR"
              exit 1
            fi
          done

      - name: Install bom tool and go-licenses
        run: |
          go install sigs.k8s.io/bom/cmd/bom@latest
          go install github.com/google/go-licenses@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Get stable releases and generate SBOMs
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          RELEASES_MODE: ${{ inputs.releases_mode }}
          MAX_RELEASES: ${{ inputs.max_releases }}
          SBOM_PATH_PREFIX: ${{ inputs.sbom_path_prefix }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          PROJECT_BUCKET: ${{ vars.PROJECT_BUCKET }}
          SUBPROJECT_BUCKET: ${{ vars.SUBPROJECT_BUCKET }}
        run: |
          set -e
          
          OWNER="${{ matrix.owner }}"
          REPO="${{ matrix.repo }}"
          PROJECT_NAME="${{ matrix.name }}"
          PARENT_PROJECT="${{ matrix.parent_project || '' }}"

          slugify() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd '[:alnum:]-'
          }

          REPO_SLUG=$(slugify "$REPO")
          if [ -n "$SBOM_PATH_PREFIX" ]; then
            PROJECT_SLUG=$(slugify "${PARENT_PROJECT:-$OWNER}")
            TARGET_BUCKET="${SUBPROJECT_BUCKET:-cncf-subproject-sboms}"
          else
            PROJECT_SLUG=$(slugify "$PROJECT_NAME")
            TARGET_BUCKET="${PROJECT_BUCKET:-cncf-project-sboms}"
          fi

          TARGET_REGION="${S3_REGION:-us-east-1}"
          
          PROCESSED=0
          ONE_WEEK_AGO=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)
          
          echo "::group::Processing $OWNER/$REPO"
          echo "Releases mode: $RELEASES_MODE"
          
          extract_go_licenses() {
            local DIR="$1"
            local OUTPUT_FILE="$2"
            
            if [ ! -f "$DIR/go.mod" ]; then
              echo "[]" > "$OUTPUT_FILE"
              return 0
            fi
            
            cd "$DIR"
            go mod download 2>/dev/null || true
            
            local LICENSES_CSV
            LICENSES_CSV=$(go-licenses csv ./... 2>/dev/null || echo "")
            
            if [ -z "$LICENSES_CSV" ]; then
              echo "[]" > "$OUTPUT_FILE"
              cd - > /dev/null
              return 0
            fi
            
            echo "$LICENSES_CSV" | awk -F',' '{
              gsub(/"/, "\\\"", $1);
              id = $1; gsub(/[^a-zA-Z0-9]/, "-", id); id = substr(id, 1, 50);
              printf "{\"licenseId\": \"LicenseRef-%s\", \"extractedText\": \"License: %s\", \"name\": \"%s\", \"comment\": \"Package: %s\"}\n", id, $3, $3, $1
            }' | jq -s '.' > "$OUTPUT_FILE" 2>/dev/null || echo "[]" > "$OUTPUT_FILE"
            
            cd - > /dev/null
          }

          object_exists() {
            local OBJECT_KEY="$1"
            aws s3api head-object \
              --endpoint-url "$S3_ENDPOINT" \
              --region "$TARGET_REGION" \
              --bucket "$TARGET_BUCKET" \
              --key "$OBJECT_KEY" >/dev/null 2>&1
          }

          upload_sbom() {
            local LOCAL_FILE="$1"
            local OBJECT_KEY="$2"

            aws s3api put-object \
              --endpoint-url "$S3_ENDPOINT" \
              --region "$TARGET_REGION" \
              --bucket "$TARGET_BUCKET" \
              --key "$OBJECT_KEY" \
              --body "$LOCAL_FILE" >/dev/null
          }
          
          generate_sbom() {
            local TAG="$1"
            local VERSION
            VERSION=$(echo "$TAG" | sed 's/^v//' | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')
            if [ -z "$VERSION" ]; then
              VERSION="unknown"
            fi

            local FILENAME_VERSION
            FILENAME_VERSION=$(echo "$VERSION" | tr '.' '_')

            local OBJECT_KEY
            local OBJECT_FILE

            if [ -n "$SBOM_PATH_PREFIX" ]; then
              OBJECT_FILE="${PROJECT_SLUG}_${REPO_SLUG}_${FILENAME_VERSION}_spdx.json"
              OBJECT_KEY="${PROJECT_SLUG}/${REPO_SLUG}/${VERSION}/${OBJECT_FILE}"
            else
              OBJECT_FILE="${PROJECT_SLUG}_${FILENAME_VERSION}_spdx.json"
              OBJECT_KEY="${PROJECT_SLUG}/${VERSION}/${OBJECT_FILE}"
            fi

            if [ "$FORCE_REGENERATE" != "true" ] && object_exists "$OBJECT_KEY"; then
              echo "SBOM already exists in bucket ($OBJECT_KEY), skipping..."
              return 1
            fi
            
            echo "Generating SBOM for $OWNER/$REPO@$TAG..."
            
            local TEMP_DIR=$(mktemp -d)
            if ! git clone --depth 1 --branch "$TAG" "https://github.com/${OWNER}/${REPO}.git" "$TEMP_DIR" 2>/dev/null; then
              rm -rf "$TEMP_DIR"
              return 1
            fi
            
            local SBOM_FILE
            SBOM_FILE=$(mktemp)
            
            local SBOM_NAME="${OWNER}/${REPO} ${TAG}"
            local SBOM_NAMESPACE="https://github.com/${OWNER}/${REPO}/releases/tag/${TAG}"
            
            if bom generate --format json --name "$SBOM_NAME" --namespace "$SBOM_NAMESPACE" --output "$SBOM_FILE" "$TEMP_DIR" 2>/dev/null; then
              local LICENSES_FILE=$(mktemp)
              extract_go_licenses "$TEMP_DIR" "$LICENSES_FILE"
              
              local TEMP_SBOM=$(mktemp)
              jq --arg owner "$OWNER" \
                 --arg repo "$REPO" \
                 --arg tag "$TAG" \
                 --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 --slurpfile licenses "$LICENSES_FILE" \
                 '
                 .creationInfo.creators += ["Tool: cncf-automation-sbom-generator"] |
                 .creationInfo.comment = "SBOM for CNCF project: \($owner)/\($repo)@\($tag)" |
                 .annotations = ((.annotations // []) + [{
                   "annotationDate": $generatedAt,
                   "annotationType": "OTHER",
                   "annotator": "Tool: cncf-automation",
                   "comment": "Repository: \($owner)/\($repo)\nVersion: \($tag)"
                 }]) |
                 .hasExtractedLicensingInfo = ((.hasExtractedLicensingInfo // []) + $licenses[0])
                 ' "$SBOM_FILE" > "$TEMP_SBOM" && mv "$TEMP_SBOM" "$SBOM_FILE"
              
              rm -f "$LICENSES_FILE"

              if upload_sbom "$SBOM_FILE" "$OBJECT_KEY"; then
                echo "Uploaded SBOM to oci://${TARGET_BUCKET}/${OBJECT_KEY}"
              else
                echo "Failed to upload SBOM to oci://${TARGET_BUCKET}/${OBJECT_KEY}"
                rm -f "$SBOM_FILE"
                rm -rf "$TEMP_DIR"
                return 1
              fi

              rm -f "$SBOM_FILE"
              rm -rf "$TEMP_DIR"
              return 0
            else
              rm -f "$SBOM_FILE"
              rm -rf "$TEMP_DIR"
              return 1
            fi
          }
          
          RELEASES=$(gh api repos/${OWNER}/${REPO}/releases --paginate -q '.[0:50]' 2>/dev/null || echo "[]")
          
          if [ "$RELEASES" == "[]" ] || [ -z "$RELEASES" ]; then
            TAGS=$(gh api repos/${OWNER}/${REPO}/tags --paginate -q '.[0:20] | .[].name' 2>/dev/null || echo "")
            
            if [ -z "$TAGS" ]; then
              echo "No tags found, skipping..."
              echo "::endgroup::"
              exit 0
            fi
            
            EFFECTIVE_MAX=$( [ "$RELEASES_MODE" == "recent" ] && echo 3 || echo $MAX_RELEASES )
            
            for TAG in $TAGS; do
              if echo "$TAG" | grep -qiE '[-\.](alpha|beta|rc|pre|dev|snapshot|nightly|canary|test|draft|wip)[0-9]*'; then
                continue
              fi
              if ! echo "$TAG" | grep -qE '^v?[0-9]+\.[0-9]+'; then
                continue
              fi
              if generate_sbom "$TAG"; then
                PROCESSED=$((PROCESSED + 1))
              fi
              if [ "$PROCESSED" -ge "$EFFECTIVE_MAX" ]; then
                break
              fi
            done
          else
            if [ "$RELEASES_MODE" == "recent" ]; then
              readarray -t RELEASE_DATA < <(echo "$RELEASES" | jq -r --arg since "$ONE_WEEK_AGO" '.[] | select(.draft == false and .prerelease == false and .published_at >= $since) | "\(.tag_name)"')
            else
              readarray -t RELEASE_DATA < <(echo "$RELEASES" | jq -r '.[] | select(.draft == false and .prerelease == false) | "\(.tag_name)"')
            fi
            
            for TAG in "${RELEASE_DATA[@]}"; do
              if echo "$TAG" | grep -qiE '[-\.](alpha|beta|rc|pre|dev|snapshot|nightly|canary|test|draft|wip)[0-9]*'; then
                continue
              fi
              if generate_sbom "$TAG"; then
                PROCESSED=$((PROCESSED + 1))
              fi
              if [ "$RELEASES_MODE" == "latest" ] && [ "$PROCESSED" -ge "$MAX_RELEASES" ]; then
                break
              fi
            done
          fi
          
          echo "::endgroup::"

      - name: SBOMs uploaded to OCI
        run: echo "SBOM generation complete; artifacts were uploaded to Oracle Object Storage."

