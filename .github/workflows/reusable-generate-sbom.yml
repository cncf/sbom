name: Generate SBOM (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      job_name:
        required: true
        type: string
      sbom_path_prefix:
        required: false
        type: string
        default: ''
      force_regenerate:
        required: false
        type: string
        default: 'false'
      releases_mode:
        required: false
        type: string
        default: 'recent'
      max_releases:
        required: false
        type: string
        default: '3'

env:
  WAYBILL_VERSION: v0.10.0

permissions:
  contents: read

jobs:
  generate:
    runs-on: cncf-c-ubuntu-2-8-x86
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(inputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Waybill
        run: |
          curl -sL "https://github.com/kusari-oss/waybill/releases/download/${WAYBILL_VERSION}/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/waybill.tar.gz
          tar xzf /tmp/waybill.tar.gz -C /tmp
          sudo install -m 755 /tmp/waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu/waybill /usr/local/bin/waybill
          waybill --version

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -q && sudo apt-get install -y -q gh
          fi
          gh --version

      - name: Install yq
        run: |
          if ! yq --version 2>/dev/null | grep -q mikefarah; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Install AWS CLI
        run: |
          if ! command -v aws &>/dev/null; then
            curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi
          aws --version

      - name: Get stable releases and generate SBOMs
        id: generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          RELEASES_MODE: ${{ inputs.releases_mode }}
          MAX_RELEASES: ${{ inputs.max_releases }}
          SBOM_PATH_PREFIX: ${{ inputs.sbom_path_prefix }}
          MATRIX_PARENT_PROJECT: ${{ matrix.parent_project }}
          MATRIX_PARENT_REPO: ${{ matrix.parent_repo }}
          MATRIX_DISCOVERED_BY: ${{ matrix.discovered_by }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
          S3_REGION: ${{ vars.OCI_S3_REGION }}
          PROJECT_BUCKET: ${{ vars.OCI_PROJECT_BUCKET }}
          SUBPROJECT_BUCKET: ${{ vars.OCI_SUBPROJECT_BUCKET }}
        run: |
          set -e -o pipefail
          source util/sbom-lib.sh
          
          OWNER="${{ matrix.owner }}"
          REPO="${{ matrix.repo }}"
          PROJECT_NAME="${{ matrix.name }}"
          SANITIZED_PROJECT=$(sbom_slugify "$PROJECT_NAME")
          [[ "$S3_ENDPOINT" != http://* && "$S3_ENDPOINT" != https://* ]] && S3_ENDPOINT="https://${S3_ENDPOINT}"

          # Supplier of the root package: the CNCF project (for subprojects, the parent project).
          if [ -n "$SBOM_PATH_PREFIX" ]; then
            SUPPLIER_PROJECT=$(sbom_resolve_parent_project "$MATRIX_PARENT_PROJECT" "$MATRIX_PARENT_REPO" "$MATRIX_DISCOVERED_BY" "$OWNER")
            SBOM_BASE_DIR="sbom/${SBOM_PATH_PREFIX}/${OWNER}/${REPO}"
            PARENT_SLUG=$(sbom_parent_slug "$MATRIX_PARENT_PROJECT" "$MATRIX_PARENT_REPO" "$MATRIX_DISCOVERED_BY" "$OWNER")
            REPO_SLUG=$(sbom_slugify "$REPO")
            BUCKET="$SUBPROJECT_BUCKET"
          else
            SUPPLIER_PROJECT="$PROJECT_NAME"
            SBOM_BASE_DIR="sbom/${SANITIZED_PROJECT}/${REPO}"
            BUCKET="$PROJECT_BUCKET"
          fi
          
          PROCESSED=0
          # Wide window on purpose: a failed weekly run must not lose that week's
          # releases forever. The bucket check below keeps reruns cheap.
          SINCE=$(date -u -d '60 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-60d +%Y-%m-%dT%H:%M:%SZ)
          
          echo "::group::Processing $OWNER/$REPO"
          echo "Releases mode: $RELEASES_MODE"

          # One listing per repo instead of one head-object per release.
          if [ -n "$SBOM_PATH_PREFIX" ]; then
            KEY_PREFIX="${PARENT_SLUG}/${REPO_SLUG}/"
          else
            KEY_PREFIX="${SANITIZED_PROJECT}/"
          fi
          if ! EXISTING_KEYS=$(AWS_PAGER="" aws s3api list-objects-v2 --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
              --bucket "$BUCKET" --prefix "$KEY_PREFIX" --query 'Contents[].Key' --output text 2>&1); then
            # Anything but a clean answer must not silently turn into a full regeneration.
            echo "::error::list-objects s3://${BUCKET}/${KEY_PREFIX} failed: ${EXISTING_KEYS}"
            exit 1
          fi

          # Same key layout as the upload step below.
          sbom_in_bucket() {
            local VERSION="$1" VERSION_SLUG KEY
            VERSION_SLUG=$(echo "$VERSION" | tr '.' '_')
            if [ -n "$SBOM_PATH_PREFIX" ]; then
              KEY="${KEY_PREFIX}${VERSION}/${PARENT_SLUG}_${REPO_SLUG}_${VERSION_SLUG}_spdx.json"
            else
              KEY="${KEY_PREFIX}${VERSION}/${SANITIZED_PROJECT}_${VERSION_SLUG}_spdx.json"
            fi
            tr '\t' '\n' <<<"$EXISTING_KEYS" | grep -qxF "$KEY"
          }

          # Returns 0 when generated, 2 when the bucket already has it, 1 on failure.
          generate_sbom() {
            local TAG="$1"
            local VERSION=$(sbom_version_of_tag "$TAG")
            local VERSION_SLUG=$(echo "$VERSION" | tr '.' '_')
            local SBOM_DIR="${SBOM_BASE_DIR}/${VERSION}"
            local SBOM_FILE="${SBOM_DIR}/${REPO}_${VERSION_SLUG}_spdx.json"

            if [ "$FORCE_REGENERATE" != "true" ] && sbom_in_bucket "$VERSION"; then
              echo "SBOM for $OWNER/$REPO@$TAG already in bucket, skipping..."
              return 2
            fi
            
            mkdir -p "$SBOM_DIR"
            local BASE="${SBOM_DIR}/${REPO}_${VERSION_SLUG}"
            sbom_import_release_assets "$OWNER" "$REPO" "$TAG" "$BASE"
            # A per-binary release SBOM is uploaded next to our scan, never instead of it.
            if [ -f "${BASE}_release_spdx.json" ] && ! bash util/postprocess-spdx.sh --owner "$OWNER" --repo "$REPO" --tag "$TAG" --project "$SUPPLIER_PROJECT" "${BASE}_release_spdx.json"; then
              rm -f "${BASE}_release_spdx.json"
            fi
            if [ -f "$SBOM_FILE" ]; then
              if bash util/postprocess-spdx.sh --owner "$OWNER" --repo "$REPO" --tag "$TAG" --project "$SUPPLIER_PROJECT" "$SBOM_FILE"; then
                echo "Successfully imported SBOM: $SBOM_FILE"
                return 0
              fi
              echo "Release SPDX asset unusable, generating instead"
              rm -f "$SBOM_FILE"
            fi

            echo "Generating SBOM for $OWNER/$REPO@$TAG..."
            
            local TEMP_DIR=$(mktemp -d)
            if ! git clone --depth 1 --branch "$TAG" "https://github.com/${OWNER}/${REPO}.git" "$TEMP_DIR" 2>/dev/null; then
              rm -rf "$TEMP_DIR"
              return 1
            fi
            
            if sbom_waybill_scan "$OWNER" "$REPO" "$TAG" "$TEMP_DIR" "$SBOM_FILE" 2>&1 | tail -5 &&
               bash util/postprocess-spdx.sh --owner "$OWNER" --repo "$REPO" --tag "$TAG" --project "$SUPPLIER_PROJECT" "$SBOM_FILE"; then
              echo "Successfully generated SBOM: $SBOM_FILE"
              rm -rf "$TEMP_DIR"
              return 0
            fi
            echo "Failed to generate SBOM for $OWNER/$REPO@$TAG"
            rm -rf "$TEMP_DIR" "$SBOM_FILE"
            return 1
          }
          
          TAG_LIMIT=$( [ "$RELEASES_MODE" == "recent" ] && echo 3 || echo "$MAX_RELEASES" )
          readarray -t TAGS < <(sbom_stable_tags "$OWNER" "$REPO" "$RELEASES_MODE" "$SINCE" "$TAG_LIMIT" || echo "__FAILED__")
          if [ "${TAGS[0]:-}" = "__FAILED__" ]; then
            exit 1
          fi
          
          SEEN=0
          for TAG in "${TAGS[@]}"; do
            generate_sbom "$TAG" && RC=0 || RC=$?
            [ "$RC" -eq 0 ] && PROCESSED=$((PROCESSED + 1))
            [ "$RC" -ne 1 ] && SEEN=$((SEEN + 1))
            if [ "$RELEASES_MODE" == "latest" ] && [ "$SEEN" -ge "$MAX_RELEASES" ]; then
              break
            fi
          done
          
          echo "processed=${PROCESSED}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Upload SBOMs to S3
        id: upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ vars.OCI_S3_ENDPOINT }}
          S3_REGION: ${{ vars.OCI_S3_REGION }}
          PROJECT_BUCKET: ${{ vars.OCI_PROJECT_BUCKET }}
          SUBPROJECT_BUCKET: ${{ vars.OCI_SUBPROJECT_BUCKET }}
          SBOM_PATH_PREFIX: ${{ inputs.sbom_path_prefix }}
          MATRIX_PARENT_PROJECT: ${{ matrix.parent_project }}
          MATRIX_PARENT_REPO: ${{ matrix.parent_repo }}
          MATRIX_DISCOVERED_BY: ${{ matrix.discovered_by }}
        run: |
          source util/s3-upload.sh
          source util/sbom-lib.sh
          OWNER="${{ matrix.owner }}"
          REPO="${{ matrix.repo }}"
          PROJECT_NAME="${{ matrix.name }}"
          SANITIZED_PROJECT=$(sbom_slugify "$PROJECT_NAME")

          # Normalize endpoint — ensure scheme is present
          [[ "$S3_ENDPOINT" != http://* && "$S3_ENDPOINT" != https://* ]] && S3_ENDPOINT="https://${S3_ENDPOINT}"

          if [ -n "$SBOM_PATH_PREFIX" ]; then
            SBOM_BASE_DIR="sbom/${SBOM_PATH_PREFIX}/${OWNER}/${REPO}"
          else
            SBOM_BASE_DIR="sbom/${SANITIZED_PROJECT}/${REPO}"
          fi

          if [ ! -d "$SBOM_BASE_DIR" ]; then
            echo "No SBOMs generated, nothing to upload"
            exit 0
          fi

          # Determine bucket and key pattern
          if [ -n "$SBOM_PATH_PREFIX" ]; then
            # Subproject: the parent folder is the parent project's slug, i.e. the
            # folder its project SBOMs use in the project bucket.
            PARENT_SLUG=$(sbom_parent_slug "$MATRIX_PARENT_PROJECT" "$MATRIX_PARENT_REPO" "$MATRIX_DISCOVERED_BY" "$OWNER")
            REPO_SLUG=$(sbom_slugify "$REPO")
            BUCKET="$SUBPROJECT_BUCKET"
          else
            BUCKET="$PROJECT_BUCKET"
          fi

          UPLOADED=0
          FAILED=0
          while IFS= read -r file; do
            rel="${file#${SBOM_BASE_DIR}/}"
            VERSION=$(dirname "$rel")
            VERSION_SLUG=$(echo "$VERSION" | tr '.' '_')
            FORMAT=$(basename "$file"); FORMAT="${FORMAT#${REPO}_${VERSION_SLUG}_}"  # [release_]{spdx,spdx3,cdx}.json

            if [ -n "$SBOM_PATH_PREFIX" ]; then
              S3_KEY="${PARENT_SLUG}/${REPO_SLUG}/${VERSION}/${PARENT_SLUG}_${REPO_SLUG}_${VERSION_SLUG}_${FORMAT}"
            else
              S3_KEY="${SANITIZED_PROJECT}/${VERSION}/${SANITIZED_PROJECT}_${VERSION_SLUG}_${FORMAT}"
            fi

            if upload_sbom "$file" "$BUCKET" "$S3_KEY"; then
              UPLOADED=$((UPLOADED + 1))
            else
              FAILED=$((FAILED + 1))
            fi
          done < <(find "$SBOM_BASE_DIR" -type f -name '*.json' | sort)

          echo "Uploaded ${UPLOADED} SBOMs to s3://${BUCKET}/"
          echo "uploaded=${UPLOADED}" >> "$GITHUB_OUTPUT"
          echo "::notice title=sbom-uploaded::${UPLOADED}"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::${FAILED} SBOM uploads failed"
            exit 1
          fi
